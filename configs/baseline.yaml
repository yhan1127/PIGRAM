# configs/baseline.yaml

seed: 42
device: cuda

legacy:
  legacy_src_dir: legacy

paths:
  train_pkl: data/processed/train.pkl
  val_pkl: data/processed/val.pkl
  test_pkl: data/processed/test.pkl

  out_root: runs/baselines
  proto_res_out_dir: runs/baselines/proto_res

suite:
  models:
    - concat_mlp
    - bilinear
    - transformer
    - prototype

model:
  hidden_dim: 128
  num_heads: 8
  num_layers: 3
  dropout: 0.1
  num_proto_types: 7
  route_bias_init: -3.0

train:
  lr: 0.0002
  weight_decay: 0.0001
  num_epochs: 80
  batch_size: 8
  grad_clip: 1.0
  early_stop_patience: 10
  warmup_epochs: 15
  log_every: 200
  num_train_samples: -1

loss:
  interaction_loss_weight: 1.0
  importance_loss_weight: 0.5
  infonce_loss_weight: 0.5

  head_b_aux_loss_weight: 0.01
  route_reg_weight: 0.05
  route_target_max: 0.25

  sigmoid_scale: 2.0
  target_weight_scale: 3.0
  infonce_pos_threshold: 0.5
  infonce_temperature: 0.2
  huber_delta: 0.10