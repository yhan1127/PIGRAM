# configs/label.yaml

seed: 42
device: cuda

legacy:
  scripts_dir: legacy
  legacy_src_dir: legacy

paths:
  checkpoint_path: runs/coarse/best.pt
  module_path: legacy/train_dualhead_coarse_3neg4pos.py

  train_pkl: data/processed/train.pkl
  val_pkl: data/processed/val.pkl
  test_pkl: data/processed/test.pkl

  out_dir: results/grammar

label:
  y_threshold: 0.5
  rule0_fit_margin: 0.15
  random_state: 42

distill_plan:
  0:
    distill_on: true
    num_fine_clusters: 2
    mode: rule0_scoreaware

  1:
    distill_on: true
    num_fine_clusters: 2
    mode: default

  2:
    distill_on: false
    num_fine_clusters: 1
    mode: off

  3:
    distill_on: false
    num_fine_clusters: 1
    mode: off

  4:
    distill_on: false
    num_fine_clusters: 1
    mode: off

  5:
    distill_on: true
    num_fine_clusters: 2
    mode: default

  6:
    distill_on: true
    num_fine_clusters: 2
    mode: default