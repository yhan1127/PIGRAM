# configs/tiny_coarse.yaml
seed: 42
device: cpu

paths:
  train_pkl: data/example/train_tiny.pkl
  val_pkl: data/example/val_tiny.pkl
  test_pkl: data/example/test_tiny.pkl
  out_dir: runs/tiny/coarse

model:
  hidden_dim: 32
  num_heads: 4
  num_layers: 1
  num_neg_rules: 3
  num_pos_rules: 4
  rule_dim: 8
  dropout: 0.1
  route_bias_init: -3.0
  neg_sigma_min: 0.10
  neg_sigma_max: 0.80
  pos_sigma_min: 1.20
  pos_sigma_max: 2.40
  sigma_schedule_epochs: 1
  sigma_residual_clip: 0.50

train:
  lr: 0.0002
  weight_decay: 0.0001
  num_epochs: 1
  batch_size: 2
  grad_clip: 1.0
  warmup_epochs: 1
  log_every: 1
  early_stop_patience: 2
  num_train_samples: -1
  use_pos_kmeans_init: false

loss:
  interaction_loss_weight: 1.0
  importance_loss_weight: 0.5
  infonce_loss_weight: 0.5
  grammar_loss_weight: 0.5
  head_b_aux_loss_weight: 0.01
  route_reg_weight: 0.05
  route_target_max: 0.25
  sigmoid_scale: 2.0
  target_weight_scale: 3.0
  infonce_pos_threshold: 0.5
  infonce_temperature: 0.2
  huber_delta: 0.10
  pos_cv2_weight: 0.003
  cv2_start_epoch: 1
  cv2_ramp_epochs: 1
  semantic_high_target_threshold: 0.50
  semantic_min_pairs: 4